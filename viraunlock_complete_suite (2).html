<!DOCTYPE html>

</head>
<body class="h-full flex flex-col bg-darkCoffee text-cream selection:bg-warmBrown selection:text-cream">

    <!-- App Container -->

        <!-- Top Header (Desktop & Mobile) -->

                    <h1 id="brandHeaderName" class="font-bold text-base sm:text-lg tracking-tight text-cream flex items-center gap-1.5">

                    </h1>
                    <!-- Live Online Status Indicator with allowed green color #22C55E -->
                    <div class="flex items-center gap-1.5 text-[11px] text-softTaupe">
                        <span class="w-2 h-2 rounded-full bg-[#22C55E] animate-pulse inline-block"></span>
                        <span id="headerOnlineCount">Calculating online...</span>
                    </div>
                </div>
            </div>

            <!-- Desktop Nav Links -->
            <nav class="hidden md:flex items-center space-x-1 bg-warmBrown/20 border border-warmBrown/40 p-1 rounded-2xl">
                <button onclick="router.navigate('home')" id="desktop-nav-home" class="px-4 py-1.5 rounded-xl text-xs font-semibold transition text-cream bg-warmBrown/60">
                    <i class="fa-solid fa-house mr-1.5 text-softTaupe"></i> Home
                </button>
                <button onclick="router.navigate('explore')" id="desktop-nav-explore" class="px-4 py-1.5 rounded-xl text-xs font-semibold transition text-softTaupe hover:text-cream">
                    <i class="fa-solid fa-compass mr-1.5 text-softTaupe"></i> Explore
                </button>
                <button onclick="router.navigate('profile')" id="desktop-nav-profile" class="px-4 py-1.5 rounded-xl text-xs font-semibold transition text-softTaupe hover:text-cream relative">
                    <i class="fa-solid fa-user-shield mr-1.5 text-softTaupe"></i> Active Sessions
                    <span id="desktopUnlockedBadge" class="absolute -top-1 -right-1 bg-softTaupe text-darkCoffee text-[9px] font-bold px-1.5 py-0.2 rounded-full hidden">0</span>
                </button>
            </nav>

            <!-- Header Right Actions -->
            <div class="flex items-center space-x-2">
                <div class="hidden lg:flex items-center w-40 xl:w-56">
                    <div class="relative w-full">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-softTaupe">
                            <i class="fa-solid fa-search text-xs"></i>
                        </span>
                        <input type="text" id="desktopSearchInput" placeholder="Search videos..." 
                            class="w-full pl-9 pr-8 py-1.5 bg-warmBrown/30 border border-warmBrown/60 rounded-xl text-cream placeholder-warmGrey text-xs focus:outline-none focus:border-softTaupe transition"
                            onkeydown="if(event.key==='Enter') handleSearchInput(this.value)">
                        <button onclick="handleSearchInput(document.getElementById('desktopSearchInput').value)" class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-softTaupe hover:text-cream">
                            <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                    </div>
                </div>

                <a href="#" id="telegramBotBtn" target="_blank" rel="noopener noreferrer" 
                   class="hidden sm:inline-flex items-center gap-1.5 px-3 py-2 bg-warmBrown/40 hover:bg-warmBrown border border-warmBrown/80 rounded-xl text-xs font-semibold text-cream transition shadow-sm">
                    <i class="fa-brands fa-telegram text-softTaupe text-sm"></i>
                    <span>Telegram Bot</span>
                </a>
            </div>
        </header>

        <!-- Mobile Search Bar -->
        <div id="mobileSearchContainer" class="md:hidden px-4 py-2.5 bg-darkCoffee border-b border-warmBrown/20">
            <div class="relative w-full">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-softTaupe">
                    <i class="fa-solid fa-search text-xs"></i>
                </span>
                <input type="text" id="mobileSearchInput" placeholder="Search videos..." 
                    class="w-full pl-9 pr-9 py-2 bg-warmBrown/30 border border-warmBrown/60 rounded-xl text-cream placeholder-warmGrey text-xs focus:outline-none focus:border-softTaupe transition"
                    onkeydown="if(event.key==='Enter') handleSearchInput(this.value)">
                <button onclick="handleSearchInput(document.getElementById('mobileSearchInput').value)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-softTaupe hover:text-cream">
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Main Content Viewport -->
        <main id="mainContent" class="flex-1 pb-20 md:pb-12 px-3 sm:px-6 py-4 overflow-y-auto">
            <!-- Dynamic content inserted by router -->
        </main>

        <!-- Bottom Navigation Bar (Mobile Only) -->
        <nav id="mobileBottomNav" class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-darkCoffee/95 backdrop-blur-lg border-t border-warmBrown/40 px-4 py-2 flex justify-around items-center">
            <button onclick="router.navigate('home')" id="nav-home" class="flex flex-col items-center py-1 text-softTaupe transition">
                <i class="fa-solid fa-house text-base mb-0.5"></i>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="router.navigate('explore')" id="nav-explore" class="flex flex-col items-center py-1 text-softTaupe transition">
                <i class="fa-solid fa-compass text-base mb-0.5"></i>
                <span class="text-[10px] font-medium">Explore</span>
            </button>
            <button onclick="router.navigate('profile')" id="nav-profile" class="flex flex-col items-center py-1 text-softTaupe transition relative">
                <i class="fa-solid fa-user-lock text-base mb-0.5"></i>
                <span class="text-[10px] font-medium">Active</span>
                <span id="mobileUnlockedBadge" class="absolute top-0 right-1 w-2 h-2 rounded-full bg-softTaupe hidden"></span>
            </button>
            <a href="#" id="mobileTelegramBtn" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center py-1 text-softTaupe transition">
                <i class="fa-brands fa-telegram text-base mb-0.5"></i>
                <span class="text-[10px] font-medium">Telegram</span>
            </a>
        </nav>

        <!-- Notification Toast -->
        <div id="toast" class="fixed top-20 right-4 z-50 transform translate-y-[-200%] opacity-0 transition-all duration-300 max-w-sm bg-warmBrown border border-softTaupe text-cream px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
            <i id="toastIcon" class="fa-solid fa-circle-check text-softTaupe text-lg"></i>
            <div>
                <h4 id="toastTitle" class="text-xs font-bold uppercase tracking-wide text-warmGrey">Notification</h4>
                <p id="toastMessage" class="text-xs text-cream"></p>
            </div>
        </div>

        <!-- Ad Simulation Modal -->
        <div id="adModal" class="fixed inset-0 z-50 bg-darkCoffee/80 backdrop-blur-md hidden flex items-center justify-center p-4">
            <div class="bg-warmBrown border border-softTaupe rounded-3xl max-w-md w-full p-6 shadow-2xl text-center relative animate-fade-in">
                <button onclick="closeAdModal()" class="absolute top-4 right-4 text-warmGrey hover:text-cream text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="w-16 h-16 rounded-2xl bg-darkCoffee/50 mx-auto flex items-center justify-center mb-4 border border-softTaupe/30">
                    <i class="fa-solid fa-rectangle-ad text-softTaupe text-3xl"></i>
                </div>
                <h3 class="text-lg font-bold text-cream mb-1">Server-Verified Demo Ad Flow</h3>
                <p class="text-xs text-warmGrey mb-6">Simulating rewarded ad verification (5 seconds). Upon completion, the backend issues a strict 5-minute timed temporary access session.</p>
                
                <div id="adTimerBox" class="bg-darkCoffee/60 rounded-2xl p-4 mb-6 border border-warmBrown/60">
                    <div id="adStatusText" class="text-sm font-semibold text-cream mb-2">Verifying ad view with backend (5s)...</div>
                    <div class="w-full bg-warmBrown/40 rounded-full h-2.5 overflow-hidden">
                        <div id="adProgressBar" class="bg-softTaupe h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>

                <button id="completeAdBtn" disabled onclick="finishDemoAd()" 
                    class="w-full py-3.5 bg-warmBrown hover:bg-softTaupe disabled:bg-warmBrown/70 disabled:text-cream/90 disabled:cursor-not-allowed text-cream font-bold rounded-xl text-sm transition shadow-[0_0_20px_rgba(167,141,120,0.35)] border border-softTaupe/60">
                    Verify & Start 5-Min Access
                </button>
            </div>
        </div>

    </div>

    <!-- Application JavaScript -->
    <script>
        /* ========================================================
           1. CONFIGURATION & STATE INITIALIZATION (GLOBAL)
           ======================================================== */
        const CONFIG = {
            telegramBotUrl: "https://t.me/ViraUnlockBot",
            unlockDurationSeconds: 300 // Exactly 5 minutes
        };

        let state = {
            currentRoute: 'home',
            currentParam: null,
            searchQuery: '',
            selectedCategory: 'All Videos',
            activeAdVideoId: null,
            adminTab: 'overview',
            adminVideoFilter: '',
            adminCategoryFilter: ''
        };

        let isAdminAuthenticated = sessionStorage.getItem('vira_admin_auth') === 'true';

        const router = {
            navigate: function(route, param = null) {
                if (route === 'admin' && !isAdminAuthenticated) {
                    state.currentRoute = 'admin-login';
                } else {
                    state.currentRoute = route;
                    state.currentParam = param;
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
                updateActiveNavStyles();
            },
            render: function() {
                const container = document.getElementById('mainContent');
                const mainHeader = document.getElementById('mainHeader');
                const mobileSearch = document.getElementById('mobileSearchContainer');
                const mobileNav = document.getElementById('mobileBottomNav');

                if (!container) return;
                container.innerHTML = '';

                if (state.currentRoute.startsWith('admin')) {
                    if (mainHeader) mainHeader.style.display = 'none';
                    if (mobileSearch) mobileSearch.style.display = 'none';
                    if (mobileNav) mobileNav.style.display = 'none';
                } else {
                    if (mainHeader) mainHeader.style.display = 'flex';
                    if (mobileSearch) mobileSearch.style.display = 'block';
                    if (mobileNav) mobileNav.style.display = 'flex';
                }

                Object.keys(activeSessions).forEach(id => isVideoUnlocked(id));

                switch(state.currentRoute) {
                    case 'home':
                        container.innerHTML = renderHomePage();
                        break;
                    case 'explore':
                        container.innerHTML = renderExplorePage();
                        break;
                    case 'detail':
                        container.innerHTML = renderDetailPage(state.currentParam);
                        break;
                    case 'profile':
                        container.innerHTML = renderProfilePage();
                        break;
                    case 'admin-login':
                        container.innerHTML = renderAdminLogin();
                        break;
                    case 'admin':
                        if (!isAdminAuthenticated) {
                            container.innerHTML = renderAdminLogin();
                        } else {
                            container.innerHTML = renderAdminDashboard();
                        }
                        break;
                    default:
                        container.innerHTML = renderHomePage();
                }
            }
        };

        /* ========================================================
           2. PERSISTENT DATABASE & SAMPLE CATALOG
           ======================================================== */
        let sampleVideos = JSON.parse(localStorage.getItem('vira_db_videos')) || [
            {
                id: "v1",
                title: "Cinematic Dhaka Street Food Tour 2026",
                description: "Explore bustling lanes of Old Dhaka tasting traditional spiced delicacies, crispy jilpis, and mouth-watering biryani.",
                category: "Deshi Viral",
                thumbnail: "https://placehold.co/600x340/6E473B/E1D4C2?text=Dhaka+Street+Food",
                videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
                isLocked: true,
                duration: "10:25",
                createdAt: "2026-06-01",
                telegramChannelId: "@viraunlock_channel",
                telegramMsgId: "104",
                published: true
            },
            {
                id: "v2",
                title: "Bangles & Heritage: Traditional Craftsmanship",
                description: "Deep dive into artisan workshops creating stunning glass bangles and hand-woven textiles passed down generations.",
                category: "New",
                thumbnail: "https://placehold.co/600x340/6E473B/E1D4C2?text=Heritage+Crafts",
                videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                isLocked: true,
                duration: "12:40",
                createdAt: "2026-06-08",
                telegramChannelId: "@viraunlock_channel",
                telegramMsgId: "105",
                published: true
            },
            {
                id: "v3",
                title: "Cox's Bazar Sunset Drone Cinematic VLOG",
                description: "Breathtaking 4K drone footage along the world's longest natural sea beach during sunset golden hour.",
                category: "Deshi Viral",
                thumbnail: "https://placehold.co/600x340/6E473B/E1D4C2?text=Cox+Bazar+Sunset",
                videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
                isLocked: false,
                duration: "08:50",
                createdAt: "2026-05-20",
                telegramChannelId: "@viraunlock_channel",
                telegramMsgId: "102",
                published: true
            },
            {
                id: "v4",
                title: "Trending Tech Gadgets Showcase 2026",
                description: "Unboxing and testing futuristic gadgets, foldable displays, and smart productivity tools.",
                category: "Trending",
                thumbnail: "https://placehold.co/600x340/6E473B/E1D4C2?text=Tech+Gadgets+2026",
                videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
                isLocked: true,
                duration: "15:10",
                createdAt: "2026-06-07",
                telegramChannelId: "@viraunlock_channel",
                telegramMsgId: "109",
                published: true
            }
        ];

        let categoriesList = JSON.parse(localStorage.getItem('vira_db_categories')) || [
            { name: "All Videos", description: "All published video streams", order: 1 },
            { name: "Deshi Viral", description: "Trending clips from Bangladesh", order: 2 },
            { name: "Trending", description: "Most popular viral highlights", order: 3 },
            { name: "New", description: "Recently added authorized clips", order: 4 }
        ];

        let adminActivityLog = JSON.parse(localStorage.getItem('vira_admin_activity')) || [
            { id: 'act_1', action: 'System Initialized', timestamp: new Date().toISOString(), user: 'System Admin' }
        ];

        let websiteSettings = JSON.parse(localStorage.getItem('vira_website_settings')) || {
            siteName: 'ViraUnlock',
            siteDescription: 'Real-Time Analytics & 5-Min Temporary Access',
            contactEmail: 'support@viraunlock.local',
            heroVisible: true,
            privacyContent: 'ViraUnlock provides temporary access sessions under strict backend authorization standards.',
            termsContent: 'Users agree to temporary viewing terms and authorized bot token delivery.'
        };

        function saveDatabase() {
            localStorage.setItem('vira_db_videos', JSON.stringify(sampleVideos));
            localStorage.setItem('vira_db_categories', JSON.stringify(categoriesList));
            localStorage.setItem('vira_admin_activity', JSON.stringify(adminActivityLog));
            localStorage.setItem('vira_website_settings', JSON.stringify(websiteSettings));
        }

        function logAdminActivity(action) {
            adminActivityLog.unshift({
                id: 'act_' + Date.now(),
                action: action,
                timestamp: new Date().toISOString(),
                user: 'Admin'
            });
            if (adminActivityLog.length > 50) adminActivityLog.pop();
            saveDatabase();
        }

        /* ========================================================
           3. ANALYTICS & REAL-TIME VIEW COUNTING ENGINE
           ======================================================== */
        let visitorId = localStorage.getItem('vira_visitor_id');
        if (!visitorId) {
            visitorId = 'anon_' + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
            localStorage.setItem('vira_visitor_id', visitorId);
        }

        let analyticsStore = JSON.parse(localStorage.getItem('vira_analytics_store')) || {
            totalVisitors: 1248,
            uniqueVisitorsMap: {},
            videoViews: { v1: 342, v2: 189, v3: 1205, v4: 278 },
            viewTimestamps: {},
            telegramDeliveriesSuccess: 420,
            telegramDeliveriesFailed: 12,
            dailyStats: {
                "2026-06-05": 142,
                "2026-06-06": 198,
                "2026-06-07": 230,
                "2026-06-08": 310,
                "2026-06-09": 275
            }
        };

        let activeSessions = JSON.parse(localStorage.getItem('vira_server_sessions')) || {};

        function saveAnalytics() {
            localStorage.setItem('vira_analytics_store', JSON.stringify(analyticsStore));
        }

        function saveSessions() {
            localStorage.setItem('vira_server_sessions', JSON.stringify(activeSessions));
            updateActiveBadges();
        }

        function registerVisitor() {
            const todayKey = new Date().toISOString().split('T')[0];
            if (!analyticsStore.uniqueVisitorsMap[visitorId]) {
                analyticsStore.uniqueVisitorsMap[visitorId] = { firstSeen: Date.now() };
                analyticsStore.totalVisitors += 1;
            }
            if (!analyticsStore.dailyStats[todayKey]) {
                analyticsStore.dailyStats[todayKey] = 0;
            }
            saveAnalytics();
        }

        let activePresenceMap = JSON.parse(localStorage.getItem('vira_active_presence')) || {};
        
        function sendHeartbeat() {
            const now = Date.now();
            activePresenceMap[visitorId] = now;
            
            Object.keys(activePresenceMap).forEach(id => {
                if (now - activePresenceMap[id] > 90000) {
                    delete activePresenceMap[id];
                }
            });
            localStorage.setItem('vira_active_presence', JSON.stringify(activePresenceMap));
            updateOnlineHeaderDisplay();
        }

        function getActiveOnlineCount() {
            const now = Date.now();
            let count = 0;
            Object.keys(activePresenceMap).forEach(id => {
                if (now - activePresenceMap[id] <= 90000) {
                    count++;
                }
            });
            return Math.max(1, count);
        }

        function updateOnlineHeaderDisplay() {
            const count = getActiveOnlineCount();
            const headerEl = document.getElementById('headerOnlineCount');
            if (headerEl) {
                headerEl.textContent = `${count} Online Now`;
            }
        }

        // STRICT REAL-TIME VIEW COUNTER (30-Minute Window per Visitor Session)
        function recordRealTimeVideoView(videoId) {
            const video = sampleVideos.find(v => v.id === videoId);
            if (!video || video.published === false) return;

            const now = Date.now();
            const viewKey = `${visitorId}_${videoId}`;
            const lastViewTime = analyticsStore.viewTimestamps[viewKey] || 0;
            const thirtyMinutes = 30 * 60 * 1000;

            if (now - lastViewTime > thirtyMinutes) {
                analyticsStore.viewTimestamps[viewKey] = now;
                if (!analyticsStore.videoViews[videoId]) {
                    analyticsStore.videoViews[videoId] = 0;
                }
                analyticsStore.videoViews[videoId] += 1;
                saveAnalytics();
            }
        }

        function getVideoViewCount(videoId) {
            return analyticsStore.videoViews[videoId] || 0;
        }

        function isVideoUnlocked(videoId) {
            const session = activeSessions[videoId];
            if (!session) return false;
            
            const now = Date.now();
            if (now >= session.expiresAt) {
                delete activeSessions[videoId];
                saveSessions();
                return false;
            }
            return true;
        }

        function getRemainingSeconds(videoId) {
            const session = activeSessions[videoId];
            if (!session) return 0;
            const diff = Math.floor((session.expiresAt - Date.now()) / 1000);
            if (diff <= 0) {
                delete activeSessions[videoId];
                saveSessions();
                return 0;
            }
            return diff;
        }

        function updateActiveBadges() {
            Object.keys(activeSessions).forEach(id => isVideoUnlocked(id));
            
            const activeCount = Object.keys(activeSessions).length;
            const badgeDesktop = document.getElementById('desktopUnlockedBadge');
            const badgeMobile = document.getElementById('mobileUnlockedBadge');
            
            if (activeCount > 0 && badgeDesktop && badgeMobile) {
                badgeDesktop.textContent = activeCount;
                badgeDesktop.classList.remove('hidden');
                badgeMobile.classList.remove('hidden');
            } else if (badgeDesktop && badgeMobile) {
                badgeDesktop.classList.add('hidden');
                badgeMobile.classList.add('hidden');
            }
        }

        function updateActiveNavStyles() {
            ['home', 'explore', 'profile'].forEach(r => {
                const btn = document.getElementById(`nav-${r}`);
                if (btn) {
                    if (state.currentRoute === r) {
                        btn.classList.add('text-cream');
                        btn.classList.remove('text-softTaupe');
                    } else {
                        btn.classList.remove('text-cream');
                        btn.classList.add('text-softTaupe');
                    }
                }
                
                const desktopBtn = document.getElementById(`desktop-nav-${r}`);
                if (desktopBtn) {
                    if (state.currentRoute === r) {
                        desktopBtn.className = "px-4 py-1.5 rounded-xl text-xs font-semibold transition text-cream bg-warmBrown/60";
                    } else {
                        desktopBtn.className = "px-4 py-1.5 rounded-xl text-xs font-semibold transition text-softTaupe hover:text-cream";
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const botLinks = [document.getElementById('telegramBotBtn'), document.getElementById('mobileTelegramBtn')];
            botLinks.forEach(link => {
                if (link) link.href = CONFIG.telegramBotUrl;
            });
            
            registerVisitor();
            sendHeartbeat();
            setInterval(sendHeartbeat, 15000);

            updateActiveBadges();
            router.render();

            setInterval(() => {
                const detailTimerEl = document.getElementById('detailCountdownTimer');
                if (state.currentRoute === 'detail' && state.currentParam) {
                    const secs = getRemainingSeconds(state.currentParam);
                    if (secs > 0) {
                        const m = Math.floor(secs / 60);
                        const s = secs % 60;
                        if (detailTimerEl) detailTimerEl.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
                    } else if (detailTimerEl && detailTimerEl.textContent !== 'Expired') {
                        detailTimerEl.textContent = 'Expired';
                        router.render();
                    }
                }
            }, 1000);
        });

        /* ========================================================
           4. SEARCH & ADMIN ACCESS INTERCEPTION (`admin563@#`)
           ======================================================== */
        function handleSearchInput(query) {
            const cleanQuery = query.trim();
            if (cleanQuery === 'admin563@#') {
                isAdminAuthenticated = true;
                sessionStorage.setItem('vira_admin_auth', 'true');

        function previewUploadThumb(input) {

                    img.src = e.target.result;
                    img.classList.remove('hidden');

        function submitVideoUpload() {
            const title = document.getElementById('uploadTitle').value.trim();
            const description = document.getElementById('uploadDesc').value.trim();
            const category = document.getElementById('uploadCategory').value;
            const thumbUrl = document.getElementById('uploadThumbUrl').value.trim();
            const channelId = document.getElementById('uploadTelegramChannel').value.trim();
            const msgId = document.getElementById('uploadTelegramMsg').value.trim();
            const published = document.getElementById('uploadPublishCheck').checked;

            if (!title || !description) {
                showToast('Validation Error', 'Title and description are required.', 'error');
                return;
            }

            const progressBox = document.getElementById('uploadProgressBox');
            const progressBar = document.getElementById('uploadProgressBar');
            const progressPercent = document.getElementById('uploadPercentText');
            const statusText = document.getElementById('uploadStatusText');

            progressBox.classList.remove('hidden');

            let progress = 0;
            const uploadInterval = setInterval(() => {
                progress += 25;
                progressBar.style.width = progress + '%';
                progressPercent.textContent = progress + '%';
                if (progress === 50) {
                    statusText.textContent = 'Storing media file in persistent object storage...';
                }
                if (progress >= 100) {
                    clearInterval(uploadInterval);
                    statusText.textContent = 'Upload complete! Saving metadata to database...';

                    setTimeout(() => {
                        const newId = 'v_' + Math.random().toString(36).substring(2, 8);
                        const finalThumb = thumbUrl || 'https://placehold.co/600x340/6E473B/E1D4C2?text=' + encodeURIComponent(title);
                        
                        sampleVideos.unshift({
                            id: newId,
                            title: title,
                            description: description,
                            category: category,
                            thumbnail: finalThumb,
                            videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
                            isLocked: true,
                            duration: "11:15",
                            createdAt: new Date().toISOString().split('T')[0],
                            telegramChannelId: channelId,
                            telegramMsgId: msgId,
                            published: published
                        });

                        saveDatabase();
                        logAdminActivity(`Uploaded and published video: ${title}`);
                        showToast('Success', 'Video uploaded and saved to database.', 'success');
                        state.adminTab = 'videos';
                        router.render();
                    }, 600);
                }
            }, 300);
        }

                        <div class="flex items-center justify-between">
                            <h3 class="font-bold text-base">Edit Video Record</h3>
                            <button onclick="document.getElementById('videoModal').remove()" class="text-[#A3A3A3] hover:text-[#F5F2ED]"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>

                        <div class="space-y-3">
                            <div>
                                <label class="block text-[#A3A3A3] mb-1">Video Title</label>
                                <input type="text" id="modalVideoTitle" value="${video.title}" class="w-full px-3 py-2 bg-[#0B0B0B] border border-[#222222] rounded-xl text-[#F5F2ED]">
                            </div>
                            <div>
                                <label class="block text-[#A3A3A3] mb-1">Description</label>
                                <textarea id="modalVideoDesc" rows="3" class="w-full px-3 py-2 bg-[#0B0B0B] border border-[#222222] rounded-xl text-[#F5F2ED]">${video.description}</textarea>
                            </div>
                            <div>
                                <label class="block text-[#A3A3A3] mb-1">Category</label>
                                <select id="modalVideoCategory" class="w-full px-3 py-2 bg-[#0B0B0B] border border-[#222222] rounded-xl text-[#F5F2ED]">
                                    ${categoriesList.map(c => `<option value="${c.name}" ${video.category===c.name?'selected':''}>${c.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-[#A3A3A3] mb-1">Thumbnail Image URL</label>
                                <input type="text" id="modalVideoThumb" value="${video.thumbnail}" class="w-full px-3 py-2 bg-[#0B0B0B] border border-[#222222] rounded-xl text-[#F5F2ED]">
                            </div>
                            <div>
                                <label class="block text-[#A3A3A3] mb-1">Telegram Source Message ID</label>
                                <input type="text" id="modalTelegramMsg" value="${video.telegramMsgId || '101'}" class="w-full px-3 py-2 bg-[#0B0B0B] border border-[#222222] rounded-xl text-[#F5F2ED]">
                            </div>
                        </div>

                        <div class="pt-4 flex justify-end gap-2">
                            <button onclick="document.getElementById('videoModal').remove()" class="px-4 py-2 bg-[#222222] text-[#A3A3A3] rounded-xl font-bold">Cancel</button>
                            <button onclick="saveVideoEditFromModal('${video.id}')" class="px-4 py-2 bg-[#8B0D1A] text-[#F5F2ED] rounded-xl font-bold">Save Changes</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function saveVideoEditFromModal(id) {
            const v = sampleVideos.find(item => item.id === id);
            if (v) {
                v.title = document.getElementById('modalVideoTitle').value.trim();
                v.description = document.getElementById('modalVideoDesc').value.trim();
                v.category = document.getElementById('modalVideoCategory').value;
                v.thumbnail = document.getElementById('modalVideoThumb').value.trim();
                v.telegramMsgId = document.getElementById('modalTelegramMsg').value.trim();
                
                saveDatabase();
                logAdminActivity(`Updated video metadata: ${v.title}`);
                document.getElementById('videoModal').remove();
                showToast('Success', 'Video record updated successfully.', 'success');
                router.render();
            }
        }

        function deleteVideoRecord(id) {
            if (confirm('Are you sure you want to delete this video record from the database?')) {
                sampleVideos = sampleVideos.filter(v => v.id !== id);
                saveDatabase();
                logAdminActivity(`Deleted video ID: ${id}`);
                showToast('Deleted', 'Video removed from database.', 'success');
                router.render();
            }
        }

        function revokeUnlockSession(videoId) {
            delete activeSessions[videoId];
            saveSessions();
            logAdminActivity(`Revoked unlock session for video ID: ${videoId}`);
            showToast('Revoked', 'Unlock access revoked.', 'success');
            router.render();
        }

        /* ========================================================
           7. 5-MINUTE UNLOCK BACKEND & TOKEN FLOW (5S AD COUNTDOWN)
           ======================================================== */
        let adCountdownInterval = null;

        function openAdModal(videoId) {
            state.activeAdVideoId = videoId;
            document.getElementById('adModal').classList.remove('hidden');
            
            const progressBar = document.getElementById('adProgressBar');
            const statusText = document.getElementById('adStatusText');
            const completeBtn = document.getElementById('completeAdBtn');

            progressBar.style.width = '0%';
            statusText.textContent = 'Verifying ad view with backend (5s)...';
            completeBtn.disabled = true;

            if (adCountdownInterval) clearInterval(adCountdownInterval);

            let secondsLeft = 5;
            adCountdownInterval = setInterval(() => {
                secondsLeft--;
                const percent = ((5 - secondsLeft) / 5) * 100;
                progressBar.style.width = percent + '%';

                if (secondsLeft > 0) {
                    statusText.textContent = `Verifying ad view with backend (${secondsLeft}s)...`;
                } else {
                    clearInterval(adCountdownInterval);
                    statusText.textContent = 'Backend ad verification successful!';
                    completeBtn.disabled = false;
                }
            }, 1000);
        }

        function closeAdModal() {
            if (adCountdownInterval) clearInterval(adCountdownInterval);
            document.getElementById('adModal').classList.add('hidden');
            state.activeAdVideoId = null;
        }

        function finishDemoAd() {
            const videoId = state.activeAdVideoId;
            if (videoId) {
                const expiresAt = Date.now() + (CONFIG.unlockDurationSeconds * 1000);
                const deliveryToken = 'tok_' + Math.random().toString(36).substring(2) + Date.now();
                
                activeSessions[videoId] = {
                    expiresAt: expiresAt,
                    deliveryToken: deliveryToken
                };
                analyticsStore.telegramDeliveriesSuccess += 1;
                saveAnalytics();
                saveSessions();
                showToast('Success!', 'Server activated 5-minute temporary unlock session.', 'success');
            }
            closeAdModal();
            router.navigate('detail', videoId);
        }

        function showToast(title, message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            
            toast.classList.remove('translate-y-[-200%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-200%]', 'opacity-0');
            }, 3500);
        }
    </script>
</body>
</html>
